<!DOCTYPE html>
<html lang="fr">
<head>

    <style>
        body {

            margin: 0; 
            padding: 20px;
        }
        .quiz-container { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 700px; 
        }
        h1 { 
            font-size: 1.5rem; 
            color: #003366; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 0.5rem;
        }
        .progress-container {
            margin-bottom: 2rem;
            text-align: center;
        }
        progress {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            margin-top: 8px;
        }
        progress::-webkit-progress-bar {
            background-color: #e5e7eb;
            border-radius: 5px;
        }
        progress::-webkit-progress-value {
            background-color: #003366;
            border-radius: 5px;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: 500;
        }
        .question { 
            font-size: 1.2rem; 
            margin-bottom: 1.5rem; 
            font-weight: 600; 
            color: #1f2937;
            line-height: 1.4;
        }
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        button { 
            padding: 14px 20px; 
            border: 2px solid #e5e7eb; 
            border-radius: 8px; 
            background: #ffffff; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-size: 1.05rem; 
            text-align: left;
            color: #374151;
            font-weight: 500;
        }
        button:hover:not(:disabled) { 
            background: #f9fafb; 
            border-color: #d1d5db;
        }
        button:disabled {
            cursor: default;
        }
        button.correct { 
            background: #ecfdf5; 
            border-color: #10b981; 
            color: #065f46;
        }
        button.wrong { 
            background: #fef2f2; 
            border-color: #ef4444; 
            color: #991b1b;
        }
        .hidden { 
            display: none; 
        }
        #next-btn, #restart-btn { 
            margin-top: 24px; 
            background: #003366; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        #next-btn:hover, #restart-btn:hover { 
            background: #002244; 
        }
        #next-btn {
            display: none;
        }
        .results { 
            text-align: center; 
        }
        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: #003366;
            margin: 1rem 0;
        }
        .feedback {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #4b5563;
        }
    </style>
</head>

            { q: "Selon le code de conduite du TEA, concernant la certification du travail, que doit faire le technicien ?", o: ["Ne certifier que le travail réellement exécuté et vérifié par soi-même", "Certifier le travail de ses collègues non qualifiés pour les aider", "Certifier avant de faire le travail pour gagner du temps", "Laisser le superviseur certifier son propre travail"], a: 0 },
            { q: "Dans le modèle SHELL, l'élément 'H' (Hardware) englobe :", o: ["Les manuels et procédures", "La réglementation", "L'outillage, l'équipement et l'aéronef", "Les communications en équipe"], a: 2 },
            { q: "Dans le modèle SHELL, le bruit, le froid et l'éclairage font partie de quelle composante ?", o: ["Software (S)", "Liveware individuel (L)", "Environment (E)", "Hardware (H)"], a: 2 },
            { q: "Dans le modèle SHELL, la fatigue, le stress et la motivation de la personne sont classés sous :", o: ["Software (S)", "Liveware (L)", "Environment (E)", "Hardware (H)"], a: 1 },
            { q: "Qui a élaboré le concept des 12 facteurs humains (Dirty Dozen) pour Transports Canada en 1993 ?", o: ["Aéro Montréal", "Gordon Dupont", "Les frères Wright", "Le BST"], a: 1 },
            { q: "Parmi les 12 facteurs humains, lesquels sont soulignés comme étant à surveiller de très près ?", o: ["Fatigue, Complaisance, Pression", "Distraction, Stress, Normes", "Manque de communication, Manque de ressources, Fatigue", "Manque de connaissances, Distraction, Normes"], a: 0 },
            { q: "Comment définit-on un 'Danger' (hazard) en gestion des risques ?", o: ["La probabilité qu'un accident survienne", "Une condition ou situation ayant le potentiel de causer un dommage", "L'évaluation mathématique des conséquences", "Une blessure déjà survenue"], a: 1 },
            { q: "L'énergie non maîtrisée et le choix inadéquat d'un extincteur sont des risques identifiés dans quel environnement ?", o: ["L'aire de trafic", "En vol", "En hangar", "Le mouvement au sol"], a: 2 },
            { q: "Un feu impliquant du bois, du tissu ou du papier appartient à quelle classe ?", o: ["Classe A", "Classe B", "Classe C", "Classe D"], a: 0 },
            { q: "Un feu impliquant des métaux inflammables (ex. magnésium) appartient à quelle classe ?", o: ["Classe A", "Classe B", "Classe C", "Classe D"], a: 3 },
            { q: "Quel type d'agent extincteur est recommandé pour un feu de métaux inflammables (Classe D) ?", o: ["L'eau en jet direct", "Le CO2 (dioxyde de carbone)", "Une poudre spécialisée", "La mousse chimique"], a: 2 }
        ];

        // --- NOUVELLE FONCTION AJOUTÉE ICI ---
        // Algorithme de Fisher-Yates pour mélanger l'ordre des questions de façon aléatoire
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // On mélange les questions avant de lancer le quiz
        shuffleArray(quizData);
        // -------------------------------------

        let currentQuestionIndex = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const nextBtn = document.getElementById('next-btn');
        const quizDiv = document.getElementById('quiz');
        const resultsDiv = document.getElementById('results');
        const scoreEl = document.getElementById('score');
        const feedbackEl = document.getElementById('feedback-text');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');

        function loadQuestion() {
            nextBtn.style.display = 'none';
            optionsEl.innerHTML = '';
            
            const currentQ = quizData[currentQuestionIndex];
            
            progressText.textContent = `Question ${currentQuestionIndex + 1} sur ${quizData.length}`;
            progressBar.value = currentQuestionIndex + 1;
            
            questionEl.textContent = currentQ.q;

            currentQ.o.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.addEventListener('click', () => selectAnswer(index, button));
                optionsEl.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex, button) {
            const currentQ = quizData[currentQuestionIndex];
            const buttons = optionsEl.querySelectorAll('button');
            
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQ.a) {
                button.classList.add('correct');
                score++;
            } else {
                button.classList.add('wrong');
                buttons[currentQ.a].classList.add('correct');
            }

            nextBtn.style.display = 'block';
        }

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            quizDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            scoreEl.textContent = score;
            
            const percentage = (score / quizData.length) * 100;
            if (percentage >= 90) {
                feedbackEl.textContent = "Excellent ! Vous maîtrisez parfaitement l'introduction à l'aéronautique.";
            } else if (percentage >= 70) {
                feedbackEl.textContent = "Très bon travail ! Vous avez une base solide.";
            } else if (percentage >= 50) {
                feedbackEl.textContent = "Bon effort, mais une révision supplémentaire des concepts de structure et facteurs humains serait utile.";
            } else {
                feedbackEl.textContent = "Il est recommandé de relire attentivement la présentation avant l'examen.";
            }
        }

        loadQuestion();
    </script>
